<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#072448" />
      <stop offset="50%" stop-color="#0A3663" />
      <stop offset="100%" stop-color="#0A6E5C" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="150" r="220" fill="#00A896" opacity="0.25" filter="url(#glow)" />
  <circle cx="1000" cy="450" r="280" fill="#FDE047" opacity="0.15" filter="url(#glow)" />

  <!-- Grid overlay -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Main Glass Container -->
  <rect x="80" y="70" width="1040" height="490" rx="32" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5" />

  <!-- Badge -->
  <rect x="130" y="120" width="340" height="42" rx="21" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1" />
  <circle cx="152" cy="141" r="5" fill="#00A896" />
  <text x="168" y="146" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#FDE047" letter-spacing="1">NABL ACCREDITED DIAGNOSTIC LAB</text>

  <!-- Lab Logo and Brand Title -->
  <text x="130" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-1">
    SAWARIYA DIAGNOSTIC
  </text>
  <text x="130" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="600" fill="#A7F3D0">
    Precision Pathology • Same-Day Digital Reports • 24*7 Open Lab
  </text>

  <!-- Value Propositions in Pills -->
  <g transform="translate(130, 330)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="260" height="52" rx="16" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2" />
    <text x="24" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Free Home Sample Visit</text>

    <!-- Pill 2 -->
    <rect x="280" y="0" width="240" height="52" rx="16" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2" />
    <text x="304" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#ffffff">6-Hour Fast Delivery</text>

    <!-- Pill 3 -->
    <rect x="540" y="0" width="280" height="52" rx="16" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2" />
    <text x="564" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#ffffff">MD Pathologist Verified</text>
  </g>

  <!-- Location & Contact Footer in Banner -->
  <g transform="translate(130, 440)">
    <text x="0" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#E2E8F0">
      Loharu Road, Opposite R.S. Sangwan Hospital, Charkhi Dadri (127306)
    </text>
    <text x="0" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#FDE047">
      24*7 Helpline: +91 99919 41207 / +91 70152 90782 | Online Reports &amp; Booking
    </text>
  </g>

  <!-- Decorative Medical Cross Graphic -->
  <g transform="translate(940, 180)" opacity="0.85">
    <circle cx="60" cy="60" r="65" fill="#0A6E5C" stroke="#00A896" stroke-width="3" />
    <rect x="48" y="25" width="24" height="70" rx="6" fill="#ffffff" />
    <rect x="25" y="48" width="70" height="24" rx="6" fill="#ffffff" />
  </g>
</svg>
