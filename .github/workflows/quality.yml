name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Content validation
        run: npm run validate:content

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Install Chromium for browser gates
        run: npx playwright install --with-deps chromium

      - name: Production build
        run: npm run build

      - name: Stage and validate static Pages artifact
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: npm run stage:pages && npm run validate:public-artifact

      - name: Browser smoke test against staged Pages artifact
        run: npm run test:e2e:pages

      - name: Accessibility test against staged Pages artifact
        run: npm run test:a11y:pages